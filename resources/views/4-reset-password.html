<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>MediLink — Reset Password</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>

    * { box-sizing: border-box; }
    body {
      margin:0; padding:0; min-height:100vh;
      font-family:'Segoe UI', Roboto, Arial, sans-serif;
      background:#FFFFFF;
      display:flex; align-items:center; justify-content:center;
      padding:40px 20px;
    }
    input { font-family:inherit; }
    input:focus { outline:none; border-color:#1554B3 !important; box-shadow:0 0 0 3px rgba(21,84,179,0.12); }
    .btn-primary {
      background:#1554B3; color:#fff; border:none; border-radius:999px;
      font-weight:700; font-size:15px; padding:13px 20px; cursor:pointer;
      transition:background .15s ease;
      box-shadow: 0 6px 16px rgba(21,84,179,0.25);
    }
    .btn-primary:hover { background:#0F3E85; }
    .field-label { font-size:13.5px; font-weight:600; color:#374151; margin-bottom:6px; display:block; }
    .field-input {
      width:100%; padding:12px 14px; border-radius:10px; border:1.5px solid #E1E5EB;
      background:#F5F7FA; font-size:14px; color:#16213E;
    }

    .reset-card {
      width:100%; max-width:920px; border:1.5px solid #E1E5EB; border-radius:18px;
      padding:44px 56px; display:flex; align-items:center; gap:40px; flex-wrap:wrap;
      box-shadow: 0 10px 40px rgba(21,84,179,0.06);
    }
    .illus-col { flex:1; min-width:260px; max-width:360px; }
    .form-col { flex:1; min-width:280px; }
</style>
</head>
<body>

  <div class="reset-card">
    <div class="illus-col">
      <svg viewBox="0 0 420 380" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
        <ellipse cx="210" cy="345" rx="150" ry="18" fill="#EEF2FA"/>
        <circle cx="210" cy="180" r="150" fill="#EAF1FD"/>
        <g>
          <rect x="120" y="90" width="180" height="240" rx="22" fill="#FFFFFF" stroke="#E1E5EB" stroke-width="2"/>
          <rect x="140" y="120" width="140" height="14" rx="7" fill="#F5F7FA"/>
          <rect x="140" y="150" width="100" height="10" rx="5" fill="#EDEFF3"/>
          <rect x="145" y="185" width="130" height="34" rx="8" fill="#F5F7FA" stroke="#E1E5EB"/>
          <rect x="145" y="230" width="130" height="34" rx="8" fill="#F5F7FA" stroke="#E1E5EB"/>
          <rect x="160" y="278" width="100" height="30" rx="15" fill="#1554B3"/>
          <rect x="180" y="291" width="60" height="6" rx="3" fill="#ffffff" opacity="0.85"/>
        </g>
        <g transform="translate(255,60) rotate(18)">
          <circle cx="30" cy="30" r="30" fill="none" stroke="#1E9C5A" stroke-width="9"/>
          <rect x="22" y="52" width="16" height="34" rx="6" fill="#1E9C5A"/>
          <circle cx="30" cy="30" r="9" fill="#ffffff"/>
        </g>
        <circle cx="88" cy="120" r="10" fill="#1E9C5A" opacity="0.55"/>
        <circle cx="335" cy="200" r="7" fill="#1554B3" opacity="0.45"/>
        <circle cx="95" cy="260" r="6" fill="#1554B3" opacity="0.35"/>
        <path d="M330 260 l10 10 m0 -10 l-10 10" stroke="#1E9C5A" stroke-width="4" stroke-linecap="round" opacity="0.6"/>
      </svg>
    </div>

    <div class="form-col">
      <div style="margin-bottom:24px;">
        <div style="display:flex; align-items:center; gap:10px;">
          <svg width="34" height="34" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <linearGradient id="crossGrad" x1="0" y1="0" x2="48" y2="48" gradientUnits="userSpaceOnUse">
                <stop offset="0" stop-color="#1554B3"/>
                <stop offset="1" stop-color="#1E9C5A"/>
              </linearGradient>
            </defs>
            <path d="M18 4H30C31.6569 4 33 5.34315 33 7V17H43C44.6569 17 46 18.3431 46 20V28C46 29.6569 44.6569 31 43 31H33V41C33 42.6569 31.6569 44 30 44H18C16.3431 44 15 42.6569 15 41V31H5C3.34315 31 2 29.6569 2 28V20C2 18.3431 3.34315 17 5 17H15V7C15 5.34315 16.3431 4 18 4Z" fill="url(#crossGrad)"/>
            <path d="M13 24L19.5 30L35 15" stroke="white" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          <span style="font-size:22px; font-weight:800; font-family:'Poppins','Segoe UI',sans-serif; letter-spacing:-0.02em;">
            <span style="color:#1554B3;">Medi</span><span style="color:#1E9C5A;">Link</span>
          </span>
        </div>
</div>
      <h1 style="font-size:24px; font-weight:800; color:#16213E; margin:0 0 26px;">Reset Password</h1>

      <form>
        <div style="margin-bottom:18px;">
          <label class="field-label" for="new_password">New Password</label>
          <input class="field-input" type="password" id="new_password" name="new_password" placeholder="••••••••" required>
        </div>

        <div style="margin-bottom:30px;">
          <label class="field-label" for="confirm_password">Confirm Password</label>
          <input class="field-input" type="password" id="confirm_password" name="confirm_password" placeholder="••••••••" required>
        </div>

        <button type="submit" class="btn-primary" style="width:180px;">Confirm</button>
      </form>
    </div>
  </div>

</body>
</html>
