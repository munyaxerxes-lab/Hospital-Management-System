<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>MediLink — Verify Your Email</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>

    * { box-sizing: border-box; }
    body {
      margin:0; padding:0; min-height:100vh;
      font-family:'Segoe UI', Roboto, Arial, sans-serif;
      background:#FFFFFF;
      display:flex; align-items:center; justify-content:center;
      padding:40px 20px;
    }
    input { font-family:inherit; }
    input:focus { outline:none; border-color:#1554B3 !important; box-shadow:0 0 0 3px rgba(21,84,179,0.12); }
    .btn-primary {
      background:#1554B3; color:#fff; border:none; border-radius:999px;
      font-weight:700; font-size:15px; padding:13px 20px; cursor:pointer;
      transition:background .15s ease;
      box-shadow: 0 6px 16px rgba(21,84,179,0.25);
    }
    .btn-primary:hover { background:#0F3E85; }
    .field-label { font-size:13.5px; font-weight:600; color:#374151; margin-bottom:6px; display:block; }
    .field-input {
      width:100%; padding:12px 14px; border-radius:10px; border:1.5px solid #E1E5EB;
      background:#F5F7FA; font-size:14px; color:#16213E;
    }

    .otp-card {
      width:100%; max-width:920px; border:1.5px solid #F6C9CE; border-radius:18px;
      padding:44px 56px; display:flex; align-items:center; gap:40px; flex-wrap:wrap;
      box-shadow: 0 10px 40px rgba(21,84,179,0.06);
    }
    .illus-col { flex:1; min-width:260px; max-width:360px; }
    .form-col { flex:1; min-width:280px; text-align:center; }
    .otp-box {
      width:44px; height:52px; border-radius:10px; border:1.5px solid #E1E5EB;
      background:#F5F7FA; text-align:center; font-size:20px; font-weight:700; color:#16213E;
    }
</style>
</head>
<body>

  <div class="otp-card">
    <div class="illus-col">
      <svg viewBox="0 0 420 380" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
        <ellipse cx="210" cy="345" rx="150" ry="18" fill="#EEF2FA"/>
        <circle cx="210" cy="180" r="150" fill="#EAF9F0"/>
        <g>
          <rect x="135" y="70" width="150" height="260" rx="26" fill="#FFFFFF" stroke="#E1E5EB" stroke-width="2"/>
          <rect x="135" y="70" width="150" height="260" rx="26" fill="none" stroke="#1554B3" stroke-width="2" opacity="0.15"/>
          <rect x="165" y="95" width="90" height="8" rx="4" fill="#F5F7FA"/>
          <g>
            <rect x="150" y="150" width="30" height="38" rx="8" fill="#F5F7FA" stroke="#1554B3" stroke-width="1.6"/>
            <rect x="188" y="150" width="30" height="38" rx="8" fill="#F5F7FA" stroke="#1554B3" stroke-width="1.6"/>
            <rect x="226" y="150" width="30" height="38" rx="8" fill="#F5F7FA" stroke="#1554B3" stroke-width="1.6"/>
            <circle cx="165" cy="169" r="4" fill="#1554B3"/>
            <circle cx="203" cy="169" r="4" fill="#1554B3"/>
            <circle cx="241" cy="169" r="4" fill="#1554B3"/>
          </g>
          <rect x="165" y="215" width="90" height="26" rx="13" fill="#1E9C5A"/>
          <rect x="185" y="224" width="50" height="8" rx="4" fill="#ffffff" opacity="0.85"/>
          <circle cx="210" cy="280" r="18" fill="#EAF1FD"/>
          <path d="M202 280 l6 6 l12 -14" stroke="#1554B3" stroke-width="3.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
        </g>
        <g transform="translate(60,140)">
          <rect x="0" y="0" width="46" height="34" rx="6" fill="#1554B3" opacity="0.9"/>
          <path d="M2 3 L23 20 L44 3" stroke="white" stroke-width="2.4" fill="none"/>
        </g>
        <circle cx="345" cy="235" r="9" fill="#1E9C5A" opacity="0.5"/>
        <circle cx="330" cy="120" r="6" fill="#1554B3" opacity="0.4"/>
        <circle cx="70" cy="260" r="7" fill="#1554B3" opacity="0.3"/>
      </svg>
    </div>

    <div class="form-col">
      <div style="display:flex; justify-content:center; margin-bottom:22px;">
        <div style="display:flex; align-items:center; gap:10px;">
          <svg width="34" height="34" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <linearGradient id="crossGrad" x1="0" y1="0" x2="48" y2="48" gradientUnits="userSpaceOnUse">
                <stop offset="0" stop-color="#1554B3"/>
                <stop offset="1" stop-color="#1E9C5A"/>
              </linearGradient>
            </defs>
            <path d="M18 4H30C31.6569 4 33 5.34315 33 7V17H43C44.6569 17 46 18.3431 46 20V28C46 29.6569 44.6569 31 43 31H33V41C33 42.6569 31.6569 44 30 44H18C16.3431 44 15 42.6569 15 41V31H5C3.34315 31 2 29.6569 2 28V20C2 18.3431 3.34315 17 5 17H15V7C15 5.34315 16.3431 4 18 4Z" fill="url(#crossGrad)"/>
            <path d="M13 24L19.5 30L35 15" stroke="white" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          <span style="font-size:22px; font-weight:800; font-family:'Poppins','Segoe UI',sans-serif; letter-spacing:-0.02em;">
            <span style="color:#1554B3;">Medi</span><span style="color:#1E9C5A;">Link</span>
          </span>
        </div>
</div>
      <h1 style="font-size:22px; font-weight:800; color:#16213E; margin:0 0 26px;">Verify Your Email</h1>

      <form>
        <div style="display:flex; gap:10px; justify-content:center; margin-bottom:18px;">
          <input class="otp-box" type="text" maxlength="1" value="0">
          <input class="otp-box" type="text" maxlength="1" value="0">
          <input class="otp-box" type="text" maxlength="1" value="0">
          <input class="otp-box" type="text" maxlength="1" value="0">
          <input class="otp-box" type="text" maxlength="1" value="0">
          <input class="otp-box" type="text" maxlength="1" value="0">
        </div>

        <div style="display:inline-block; background:#F5F7FA; border-radius:999px; padding:5px 16px; font-size:12.5px; color:#6B7280; font-weight:600; margin-bottom:20px;">
          05:00
        </div>

        <div>
          <button type="submit" class="btn-primary" style="width:220px;">Verify OTP</button>
        </div>

        <p style="margin-top:18px;">
          <a href="#" style="color:#1554B3; font-size:13.5px; font-weight:600; text-decoration:underline;">Resend</a>
        </p>
      </form>
    </div>
  </div>

</body>
</html>
